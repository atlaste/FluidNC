name: TMC2209 XYZ
board: FluidNC 4X 2209
meta: 2024-02-05 B. Dring Mini Mill Test
stepping:
  engine: I2S_STREAM
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 4
  disable_delay_us: 0
uart1:
  txd_pin: gpio.16
  rxd_pin: gpio.4
  baud: 115200
  mode: 8N1
uart2:
  txd_pin: gpio.25
  rxd_pin: gpio.26
  baud: 1000000
  mode: 8N1
uart_channel2:
  report_interval_ms: 75
  uart_num: 2
axes:
  shared_stepper_disable_pin: NO_PIN
  homing_runs: 1
  x:
    steps_per_mm: 400
    max_rate_mm_per_min: 1500
    acceleration_mm_per_sec2: 100
    max_travel_mm: 1000
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: false
      seek_mm_per_min: 1500
      feed_mm_per_min: 700
    motor0:
      limit_neg_pin: gpio.35:low
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 0
        r_sense_ohms: 0.11
        run_amps: 1.8
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.5
        use_enable: false
        direction_pin: i2so.1:low
        step_pin: i2so.2
        disable_pin: i2so.0
  y:
    steps_per_mm: 400
    max_rate_mm_per_min: 1500
    acceleration_mm_per_sec2: 100
    max_travel_mm: 1000
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: true
      seek_mm_per_min: 1000
      feed_mm_per_min: 700
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.34:low
      limit_all_pin: NO_PIN
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 1
        r_sense_ohms: 0.11
        run_amps: 1.5
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.5
        use_enable: false
        direction_pin: i2so.4:low
        step_pin: i2so.5
        disable_pin: i2so.7
  z:
    steps_per_mm: 400
    max_rate_mm_per_min: 1500
    acceleration_mm_per_sec2: 200
    max_travel_mm: 1000
    homing:
      cycle: 1
      mpos_mm: 0
      positive_direction: true
      seek_mm_per_min: 1000
      feed_mm_per_min: 700
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.39:low
      limit_all_pin: NO_PIN
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 2
        r_sense_ohms: 0.11
        run_amps: 1.5
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.5
        use_enable: false
        direction_pin: i2so.9:low
        step_pin: i2so.10
        disable_pin: i2so.8
control:
  safety_door_pin: gpio.32:low:pu
  cycle_start_pin: NO_PIN

probe:
  pin: gpio.36:low
  toolsetter_pin: gpio.33:low:pu
spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18
i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17
sdcard:
  cs_pin: gpio.5
  card_detect_pin: NO_PIN

rapidchange:
  # ---- traverse heights, outermost first ----------------------------------
  # RapidChange calls this z_safe_clearance. Everything on the table clears.
  safe_z_mpos_mm: -1.000000
  # Height the spindle retracts to after an engagement, and the height it
  # crosses the magazine at when going straight from putting one tool away to
  # picking the next one up. Clear of the pockets and anything standing in them,
  # but low enough to be worth not going all the way back up to safe_z. Any
  # other move to a pocket goes via safe_z, because only just having come up out
  # of a pocket tells us what is underneath.
  z_traverse_mpos_mm: -20.000
  # Lowest point at which the spindle may already be turning, and the height the
  # second engagement pass backs up to.
  z_spindle_start_mpos_mm: -40.000
  # Bottom of the threading travel. This is the number that decides whether the
  # holder threads fully on, so it is worth dialling in by hand at low rpm.
  z_engage_mpos_mm: -55.000

  # ---- tool detection beam ------------------------------------------------
  # The beam runs above the pockets and answers one question: is there a tool in
  # the spindle. It is checked before and after every engagement, so a holder
  # that failed to release or failed to pick up is caught while the spindle is
  # still over the pocket. Too coarse for measurement, which is what the
  # toolsetter below is for. Add :low if the sensor pulls low when blocked.
  tool_present_pin: NO_PIN
  # Machine Z at which a fitted tool interrupts the beam.
  beam_check_mpos_mm: -25.000
  # Machine Z at which a correctly seated tool has cleared the beam. A
  # cross-threaded holder hangs lower and is still in it, which is what tells
  # that failure apart from a good pick-up - and it is the failure that throws a
  # holder, so it is worth the extra move. Must be above beam_check_mpos_mm.
  # Omit it to skip the check.
  beam_clear_mpos_mm: -15.000
  beam_settle_ms: 100

  # ---- magazine ------------------------------------------------------------
  # One flat vector of x/y/z per pocket, so the pockets do not have to lie on a
  # line. Z is the height the pocket itself sits at; the threading travel is
  # driven by the z_* values above, not by this.
  pocket_mpos_mm: 10.000 -10.000 -52.000  40.000 -10.000 -52.000  70.000 -10.000 -52.000
  # Which tool starts in which pocket, 0 for empty. This only seeds the magazine
  # on the first boot and afterwards says where a tool prefers to be put back;
  # live occupancy is persisted, so the changer remembers across a reboot what it
  # is actually holding. Use M61 Q<tool> to tell it about a manual intervention.
  pocket_tools: 1 2 3

  # ---- threading cycle -----------------------------------------------------
  engage_feed_rate_mm_per_min: 1800.000
  load_rpm: 900
  unload_rpm: 900
  # Time for the spindle to reach speed before the threads meet.
  spindle_settle_ms: 500
  # Threading a holder on takes a second pass to torque it up. Backing one off
  # only needs one, so this applies to loading only.
  engage_passes: 2

  # ---- pre-change check ----------------------------------------------------
  # The tool already in the spindle is re-measured before anything moves. More
  # than this much difference from its recorded length means it broke, slipped in
  # the collet, or is not the tool it is recorded as, and the change stops at
  # retreat_mpos_mm for you to decide. Loose enough not to trip on a warm
  # machine, tight enough to catch a snapped cutter.
  tool_length_drift_mm: 0.500

  # Where the machine parks when it gives up, before it alarms.
  retreat_mpos_mm: 80.000 0.000 -1.000

  # Where the operator fits or removes a tool by hand. A tool with no pocket -
  # too long, too fat, or just not assigned one - is not an error: the machine
  # parks here, asks, and measures whatever gets fitted, so a job can mix
  # pocketed tools with a manual one. Omit to reuse retreat_mpos_mm.
  manual_mpos_mm: 80.000 0.000 -1.000

  probe_seek_rate_mm_per_min: 500.000000
  probe_feed_rate_mm_per_min: 80.000000
  # X/Y is the centre of the toolsetter. Z is the deepest the spindle may go
  # before the probe is declared a miss, so set it just short of the collet
  # reaching the setter.
  ets_mpos_mm: 5.000 -9.000 -40.000
  ets_rapid_z_mpos_mm: -25.0
  # Machine Z at which a zero-length tool would trip the setter. Calibrate once:
  # probe a tool whose length you know, then subtract that length from the
  # contact Z that gets logged. Tool lengths are rejected until this is right,
  # so a fresh install fails safe rather than applying wrong offsets.
  ets_surface_mpos_mm: -38.000
  probe_retract_mm: 5.000
  probe_repeats: 2
  probe_tolerance_mm: 0.030
  min_tool_length_mm: 5.000
  max_tool_length_mm: 120.000
  # Optional air blast to clear the setter before probing. Needs a matching
  # user_outputs digital entry; -1 disables it.
  air_blast_output: -1
  air_blast_ms: 0
  # Refuse g-code motion until a tool length has been measured, in the same
  # spirit as start/must_home. Jogging and probing stay allowed, and the gate is
  # suspended during a tool change so the sequence that produces a measurement is
  # not blocked by the absence of one. Turning this on means no g-code motion from
  # power-up until the first tool change, so it is off unless you ask for it.
  must_measure_tool: false

# The table, as a floor under the cutting edge rather than under the spindle.
# Unlike the z axis limits above, this bound follows the tool length offset, so
# it means the same thing for a stub drill and for a long end mill. Set min_mm
# to the machine Z at which the tip of a correctly measured tool just touches
# the wasteboard.
#
# unknown_tool_length_mm covers the case that the axis limits cannot: with no
# offset applied the tip and the spindle nose coincide arithmetically, so a long
# tool would otherwise be invisible to the check. Set it to the longest tool
# that can be fitted and the floor holds whether or not the tool was probed.
# Leave it at 0 if you drive this machine without tool offsets at all.
fixed_plane:
  axis: Z
  min_mm: -95.000
  unknown_tool_length_mm: 120.000
  # The threading travel puts a fitted tool well below this floor on purpose, so
  # the floor stands down while the changer is in control and is enforced again
  # the moment it is not.
  suspend_during_tool_change: true

# The magazine itself, as a volume the cutting edge is not allowed into. The
# changer drives through this box on purpose, hence the same suspension. The
# rest of the time it is the only thing standing between a job and the pockets.
# Size it to the body of the unit plus whatever the holders stand proud, not
# just to the pocket centres.
fixed_box:
  enabled: true
  suspend_during_tool_change: true
  min_x: 0.000
  max_x: 85.000
  min_y: -25.000
  max_y: 5.000
  min_z: -100.000
  max_z: -30.000


pwm:
  pwm_hz: 5000
  direction_pin: NO_PIN
  output_pin: gpio.14
  enable_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  spinup_ms: 0
  spindown_ms: 0
  tool_num: 0
  speed_map: 0=0.000% 1000=100.000%
  off_on_alarm: false
  atc: rapidchange
#  M6_macro: G55 G0X0Y0
  
Laser:
  pwm_hz: 5000
  output_pin: gpio.13
  enable_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  tool_num: 10
  speed_map: 0=0.000% 255=100.000%
  off_on_alarm: true
#  M6_macro: G90 & G55 & G0X0Y0
  
verbose_errors: true


parking:
  enable: true
  axis: Z
  pullout_distance_mm: 5.000
  pullout_rate_mm_per_min: 250.000
  target_mpos_mm: -5.000
  rate_mm_per_min: 800.000
  