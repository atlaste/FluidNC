name: TMC2209 XYZ
board: FluidNC 4X 2209
meta: 2024-02-05 B. Dring Mini Mill Test
stepping:
  engine: I2S_STREAM
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 4
  disable_delay_us: 0
uart1:
  txd_pin: gpio.16
  rxd_pin: gpio.4
  baud: 115200
  mode: 8N1
uart2:
  txd_pin: gpio.25
  rxd_pin: gpio.26
  baud: 1000000
  mode: 8N1
uart_channel2:
  report_interval_ms: 75
  uart_num: 2
axes:
  shared_stepper_disable_pin: NO_PIN
  homing_runs: 1
  x:
    steps_per_mm: 400
    max_rate_mm_per_min: 1500
    acceleration_mm_per_sec2: 100
    max_travel_mm: 1000
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: false
      seek_mm_per_min: 1500
      feed_mm_per_min: 700
    motor0:
      limit_neg_pin: gpio.35:low
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 0
        r_sense_ohms: 0.11
        run_amps: 1.8
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.5
        use_enable: false
        direction_pin: i2so.1:low
        step_pin: i2so.2
        disable_pin: i2so.0
  y:
    steps_per_mm: 400
    max_rate_mm_per_min: 1500
    acceleration_mm_per_sec2: 100
    max_travel_mm: 1000
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: true
      seek_mm_per_min: 1000
      feed_mm_per_min: 700
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.34:low
      limit_all_pin: NO_PIN
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 1
        r_sense_ohms: 0.11
        run_amps: 1.5
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.5
        use_enable: false
        direction_pin: i2so.4:low
        step_pin: i2so.5
        disable_pin: i2so.7
  z:
    steps_per_mm: 400
    max_rate_mm_per_min: 1500
    acceleration_mm_per_sec2: 200
    max_travel_mm: 1000
    homing:
      cycle: 1
      mpos_mm: 0
      positive_direction: true
      seek_mm_per_min: 1000
      feed_mm_per_min: 700
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.39:low
      limit_all_pin: NO_PIN
      pulloff_mm: 2
      tmc_2209:
        uart_num: 1
        addr: 2
        r_sense_ohms: 0.11
        run_amps: 1.5
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.5
        use_enable: false
        direction_pin: i2so.9:low
        step_pin: i2so.10
        disable_pin: i2so.8

  a:
    steps_per_mm: 400
    max_rate_mm_per_min: 200
    acceleration_mm_per_sec2: 25
    max_travel_mm: 200
    homing:
      cycle: -1
      mpos_mm: 0
      positive_direction: false
      seek_mm_per_min: 200
      feed_mm_per_min: 100

    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      tmc_2209:
        uart_num: 1
        addr: 3
        r_sense_ohms: 0.110
        run_amps: 1.000
        hold_amps: 0.500
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        direction_pin: i2so.12
        step_pin: i2so.13
        disable_pin: i2so.15

control:
  safety_door_pin: gpio.32:low:pu
  cycle_start_pin: NO_PIN

probe:
  pin: gpio.36:low
  toolsetter_pin: gpio.33:low:pu
spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18
i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17
sdcard:
  cs_pin: gpio.5
  card_detect_pin: NO_PIN

atc_manual:
  safe_z_mpos_mm: -1.000000
  probe_seek_rate_mm_per_min: 500.000000
  probe_feed_rate_mm_per_min: 80.000000
  change_mpos_mm: 80.000 0.000 -1.000
  retrieve_mpos_mm: 80.000 0.000 -1.000
  ets_mpos_mm: 5.000 -9.000 -40.000
  ets_rapid_z_mpos_mm: -25.0
  # Calibrate once: probe a tool of known length, then
  # ets_surface_mpos_mm = <logged contact Z> - <known length>
  ets_surface_mpos_mm: -38.000
  probe_retract_mm: 5.000
  probe_repeats: 2
  probe_tolerance_mm: 0.030
  min_tool_length_mm: 5.000
  max_tool_length_mm: 120.000
  air_blast_output: -1
  air_blast_ms: 0
  # Refuse g-code motion until a tool length has been measured, in the same
  # spirit as start/must_home. Jogging and probing stay allowed, and the gate is
  # suspended during a tool change so the sequence that produces a measurement is
  # not blocked by the absence of one. Turning this on means no g-code motion from
  # power-up until the first tool change, so it is off unless you ask for it.
  must_measure_tool: false

# The table, as a floor under the cutting edge rather than under the spindle.
# Unlike the z axis limits, this bound follows the tool length offset, so it
# means the same thing for a stub drill and for a long end mill. Set min_mm to
# the machine Z at which the tip of a correctly measured tool just touches the
# wasteboard.
#
# unknown_tool_length_mm covers the case that the axis limits cannot: with no
# offset applied the tip and the spindle nose coincide arithmetically, so a long
# tool would otherwise be invisible to the check. Set it to the longest tool
# that can be fitted and the floor holds whether or not the tool was probed.
# Leave it at 0 if you drive this machine without tool offsets at all.
fixed_plane:
  axis: Z
  min_mm: -95.000
  unknown_tool_length_mm: 120.000

