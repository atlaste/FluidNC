board: FluidNC-S3
name: CNC
meta: 
stepping:
  engine: I2S_STREAM
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 8
  disable_delay_us: 8
  segments: 12

spi:
  miso_pin: gpio.13
  mosi_pin: gpio.11
  sck_pin: gpio.12

i2so:
  bck_pin: gpio.8
  data_pin: gpio.14
  ws_pin: gpio.21

uart2:
  rxd_pin: gpio.15
  txd_pin: gpio.7
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 1000000
  mode: 8N1

uart_channel1:
  uart_num: 2
  report_interval_ms: 75
  message_level: info

ethernet:
  cs_pin: gpio.10
  dhcp: true
  int_pin: gpio.4
  spi_freq_mhz: 20

sdcard:
  cs_pin: gpio.0
  card_detect_pin: NO_PIN
  frequency_hz: 8000000

state_persistence:
  cs_pin: gpio.5
  save_interval_ms: 100
  spi_freq_mhz: 20
  save_parameters: true

kinematics:
  Cartesian:

axes:
  shared_stepper_disable_pin: NO_PIN
  shared_stepper_reset_pin: NO_PIN
  homing_runs: 2
  x:
    steps_per_mm: 320
    max_rate_mm_per_min: 6000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 540.000
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: true
      feed_mm_per_min: 100.000
      seek_mm_per_min: 1000.000
      settle_ms: 100
    motor0:
      limit_all_pin: gpio.39
      hard_limits: false
      pulloff_mm: 10.000
      standard_stepper:
        disable_pin: i2so.3
        direction_pin: i2so.2:low
        step_pin: i2so.1
  y:
    steps_per_mm: 384
    max_rate_mm_per_min: 6000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 500.000
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: true
      feed_mm_per_min: 100.000
      seek_mm_per_min: 1000.000
      settle_ms: 100
    motor0:
      limit_all_pin: gpio.48:low
      hard_limits: false
      pulloff_mm: 10.000
      standard_stepper:
        disable_pin: i2so.12
        direction_pin: i2so.15
        step_pin: i2so.14
    motor1:
      limit_all_pin: gpio.17:low
      hard_limits: false
      pulloff_mm: 12.908850
      standard_stepper:
        disable_pin: i2so.11
        direction_pin: i2so.10
        step_pin: i2so.9
  z:
    steps_per_mm: 320
    max_rate_mm_per_min: 5000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 250.000
    soft_limits: false
    homing:
      cycle: 1
      positive_direction: true
      feed_mm_per_min: 100.000
      seek_mm_per_min: 800.000
      settle_ms: 100
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_all_pin: gpio.40
      hard_limits: false
      pulloff_mm: 6.000
      standard_stepper:
        disable_pin: i2so.6
        direction_pin: i2so.5:low
        step_pin: i2so.4
  a:
    steps_per_mm: 320
    max_rate_mm_per_min: 3000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 25000
    motor0:
      standard_stepper:
        disable_pin: i2so.20
        direction_pin: i2so.23
        step_pin: i2so.22
  b:
    steps_per_mm: 64
    max_rate_mm_per_min: 600.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 320.000
    motor0:
      standard_stepper:
        disable_pin: i2so.19
        direction_pin: i2so.18
        step_pin: i2so.17

control:
  cycle_start_pin: gpio.18:low
  safety_door_pin: gpio.16:low
  estop_pin: gpio.38

probe:
  pin: gpio.41
  check_mode_start: true

start:
  must_home: false
  deactivate_parking: false
  check_limits: true

H2A:
  uart:
    txd_pin: gpio.1
    rxd_pin: gpio.6
    baud: 19200
    mode: 8E1
  modbus_id: 1
  tool_num: 0
  speed_map: 0=0% 24000=100%
  
user_outputs:
  digital1_pin: i2so.31
  digital2_pin: i2so.30
  digital3_pin: i2so.29
  digital4_pin: i2so.28

arc_tolerance_mm: 0.002000
junction_deviation_mm: 0.010000
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 16

performance_profiler:
  enable: true
  enable_pc_sampling: true
  update_rate: 1000

scurve_planner:
  # Default settings are fine.

